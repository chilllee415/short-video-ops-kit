:root{--bg:#07080d;--panel:#11131b;--line:rgba(255,255,255,.11);--text:#f4f5f8;--muted:#9a9fb0;--faint:#62687a;--cyan:#70e5d3;--violet:#9b87ff;--orange:#ffb36d;--pink:#ff7f9e;--green:#76df9f;--mono:ui-monospace,"SFMono-Regular",Menlo,monospace;--sans:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:var(--sans);background:radial-gradient(700px 540px at 0 -8%,rgba(55,207,184,.12),transparent 68%),radial-gradient(900px 720px at 100% 0,rgba(119,91,230,.19),transparent 66%),var(--bg)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(#000,transparent 88%)}a{color:inherit}.shell{width:min(1220px,calc(100% - 48px));margin:auto;padding:32px 0 90px}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;color:var(--muted);font:11px var(--mono);letter-spacing:.13em}.back{color:var(--cyan);text-decoration:none}.connected:before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(118,223,159,.09)}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:0 22px 70px rgba(0,0,0,.14)}.identity{display:grid;grid-template-columns:1.35fr 1fr;overflow:hidden}.profile{display:flex;align-items:center;gap:22px;padding:28px 31px}.avatar{width:96px;height:96px;flex:none;overflow:hidden;border:1px solid rgba(255,255,255,.17);border-radius:28px;background:linear-gradient(135deg,rgba(112,229,211,.28),rgba(155,135,255,.3));box-shadow:0 14px 42px rgba(0,0,0,.34)}.avatar img{width:100%;height:100%;object-fit:cover}.avatar-fallback{display:grid;width:100%;height:100%;place-items:center;color margin:0 0 5px;font-size:27px;letter-spacing:-.05em}.section-head p{margin:0;color:var(--muted);font-size:12px}.section-index{color:var(--faint);font:10px var(--mono)}.analysis-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.panel{min-height:260px;padding:22px}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel-head h3{margin:0;font-size:15px}.panel-head span{color:var(--faint);font:9px var(--mono)}.layer-list{display:grid;gap:15px;margin-top:24px}.layer-row{display:grid;grid-template-columns:94px 1fr 28px;gap:10px;align-items:center;color:var(--muted);font-size:11px}.bar{height:7px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.06)}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--cyan))}.layer-row b{color:var(--text);font:11px var(--mono);text-align:right}.keyword-cloud{display:flex;min-height:190px;align-content:center;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;padding-top:18px}.word{padding:5px 9px;border:1px solid rgba(112,229,211,.2);border-radius:99px;color:var(--cyan);font-size:calc(11px + var(--scale)*1px);transform:rotate(var(--rotate));background:rgba(112,229,211,.035)}.profile-summary{display:flex;height:190px;align-items:end;gap:8px;padding-top:22px}.profile-segment{display:flex;min-width:0;flex-direction:column;justify-content:end;padding:13px 10px;border-radius:13px;background:linear-gradient(180deg,rgba(155,135,255,.2),rgba(112,229,211,.06));flex:var(--grow)}.profile-segment strong{color:var(--cyan);font:22px var(--mono)}.profile-segment span{margin-top:7px;overflow:hidden;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.opportunities{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.opportunity{display:flex;min-height:348px;flex-direction:column;padding:23px;transition:.25s}.opportunity:hover{transform:translateY(-4px);border-color:rgba(112,229,211,.4)}.opp-top{display:flex;justify-content:space-between}.type{color:var(--violet);font:10px var(--mono)}.confidence{padding:4px 8px;border-radius:99px;background:rgba(255,179,109,.1);color:var(--orange);font-size:10px}.opportunity h3{margin:20px 0 10px;font-size:20px;line-height:1.3}.opportunity p{margin:0;color:var(--muted);font-size:12px;line-height:1.75}.evidence{margin:17px 0;color:var(--faint);font:9px/1.55 var(--mono)}.suggestion{margin-top:auto;padding-top:15px;border-top:1px solid var(--line);color:#d9dbe4;font-size:11px;line-height:1.7}.suggestion b{display:block;margin-bottom:5px;color:var(--cyan);font:9px var(--mono)}.comments{overflow:hidden}.comment-tools{display:flex;gap:8px;padding:16px;border-bottom:1px solid var(--line)}button{font:inherit}.filter{padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--muted);cursor:pointer}.filter.active{border-color:rgba(112,229,211,.35);background:rgba(112,229,211,.08);color:var(--cyan)}.comment-list{display:grid;grid-template-columns:1fr 1fr;padding:0 20px}.comment{display:grid;grid-template-columns:9px 1fr auto;gap:11px;padding:17px 3px;border-bottom:1px solid rgba(255,255,255,.065);cursor:pointer}.comment:nth-child(odd){padding-right:20px}.comment:nth-child(even){padding-left:20px;border-left:1px solid rgba(255,255,255,.065)}.dot{width:7px;height:7px;margin-top:6px;border-radius:50%;background:var(--faint)}.dot.high{background:var(--orange);box-shadow:0 0 0 5px rgba(255,179,109,.08)}.comment-text{font-size:12px;line-height:1.65}.comment-sub,.comment-score{margin-top:5px;color:var(--faint);font:9px var(--mono)}.empty{padding:40px;color:var(--muted);text-align:center}.drawer{position:fixed;z-index:20;inset:0;display:none;align-items:stretch;justify-content:flex-end;background:rgba(0,0,0,.48)}.drawer.open{display:flex}.drawer-panel{width:min(460px,92vw);padding:28px;background:#10121a;border-left:1px solid var(--line);box-shadow:-30px 0 70px rgba(0,0,0,.35)}.drawer-panel button{float:right;border:0;background:transparent;color:var(--muted);font-size:25px;cursor:pointer}.drawer-panel h3{margin-top:48px}.drawer-block{margin-top:22px;padding-top:15px;border-top:1px solid var(--line)}.drawer-block small{display:block;margin-bottom:7px;color:var(--cyan);font:9px var(--mono)}.drawer-block p{color:#d5d7e0;line-height:1.7}@media(max-width:920px){.identity,.hero{grid-template-columns:1fr}.facts{border-left:0;border-top:1px solid var(--line)}.analysis-grid,.opportunities{grid-template-columns:1fr}.comment-list{grid-template-columns:1fr}.comment:nth-child(n){padding-left:3px;padding-right:3px;border-left:0}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{width:min(100% - 26px,560px)}.profile{align-items:flex-start;padding:22px}.avatar{width:74px;height:74px;border-radius:21px}.facts{padding:22px}.hero-main,.next{padding:22px}.metric{min-height:100px}.metric strong{font-size:28px}}
</style></head><body><main class="shell"><div class="topline"><a class="back" href="comment-insight-index.html">← 返回报告库</a><span class="connected">数据已连接</span></div><section class="card identity"><div class="profile" id="profile"></div><div class="facts" id="facts"></div></section><section class="hero"><article class="card hero-main"><span class="kicker">AI GENERATED CONCLUSION</span><h2 id="summary"></h2><p id="summaryDetail"></p></article><aside class="card next"><span class="kicker">AI NEXT MOVE</span><h3 id="nextTitle"></h3><p id="nextCopy"></p><div class="action" id="nextAction"></div></aside></section><section class="metrics" id="metrics"></section><section class="section"><div class="section-head"><div><h2>评论信号</h2><p>分类、重复词与需求画像</p></div><span class="section-index">01 / SIGNAL</span></div><div class="analysis-grid"><article class="card panel"><div class="panel-head"><h3>评论分层</h3><span>按数量</span></div><div class="layer-list" id="layers"></div></article><article class="card panel"><div class="panel-head"><h3>关键词</h3><span>重复信号</span></div><div class="keyword-cloud" id="keywords"></div></article><article class="card panel"><div class="panel-head"><h3>用户需求画像</h3><span>信号构成</span></div><div class="profile-summary" id="profiles"></div></article></div></section><section class="section"><div class="section-head"><div><h2>需求与机会</h2><p>每项建议都绑定真实评论证据</p></div><span class="section-index">02 / OPPORTUNITY</span></div><div class="opportunities" id="opportunities"></div></section><section class="section"><div class="section-head"><div><h2>评论证据</h2><p>点击评论查看分类和下一步</p></div><span class="section-index">03 / EVIDENCE</span></div><div class="card comments"><div class="comment-tools"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="high">高价值</button></div><div class="comment-list" id="comments"></div></div></section></main><aside class="drawer" id="drawer"><div class="drawer-panel"><button id="close">×</button><h3 id="drawerTitle"></h3><div class="drawer-block"><small>AI 分类</small><p id="drawerClass"></p></div><div class="drawer-block"><small>用户意图</small><p id="drawerIntent"></p></div><div class="drawer-block"><small>建议动作</small><p id="drawerNext"></p></div></div></aside><script>

const pageData={};
/* INSIGHT_DATA_END */
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>new Intl.NumberFormat('zh-CN').format(Number(v)||0),comments=pageData.comments||[],opps=pageData.opportunities||[],views=pageData.viewpoints||[],name=pageData.displayName||pageData.accountId||'未知账号';document.title=`抖音评论洞察 · ${name}`;const fallback=`<span class="avatar-fallback">${esc(name.slice(0,1))}</span>`,avatar=pageData.avatar?`<img src="${esc(pageData.avatar)}" alt="${esc(name)}头像" onerror="this.parentElement.innerHTML='${fallback.replace(/'/g,"&#39;")}'">`:fallback;document.querySelector('#profile').innerHTML=`<div class="avatar">${avatar}</div><div><span class="eyebrow">账号信息 / 抖音账号</span><div><h1>${esc(name)}</h1><span class="handle">@${esc(pageData.accountId)}</span></div><p class="bio">${esc(pageData.bio)}</p></div>`;document.querySelector('#facts').innerHTML=`<div class="fact"><small>内容赛道</small><span class="tag">${esc(pageData.lane||'未分类')}</span></div><div class="fact"><small>数据来源</small><strong>${esc(pageData.source?.provider||'未知')}</strong></div><div class="fact"><small>粉丝数</small><strong>${fmt(pageData.followers)}</strong></div><div class="fact"><small>作品数</small><strong>${fmt(pageData.works)}</strong></div>`;document.querySelector('#summary').textContent=pageData.summary||'暂无结论';document.querySelector('#summaryDetail').textContent=views[0]?.summary||'等待更多评论证据。';const lead=opps[0]||{};document.querySelector('#nextTitle').textContent=lead.title||'继续积累评论证据';document.querySelector('#nextCopy').textContent=lead.inference||'当前证据不足，建议增加样本后再判断。';document.querySelector('#nextAction').innerHTML=`<b>验证动作</b><br>${esc(lead.validationAction||'采集更多评论并重新分析。')}`;const m=pageData.metrics||{},metricRows=[['已分析评论',pageData.commentCount],['高价值信号',m.highValueSignals||(pageData.highValueComments||[]).length],['需求分组',m.needClusters||views.length],['高潜机会',m.highPotential||opps.length]];document.querySelector('#metrics').innerHTML=metricRows.map(([l,v])=>`<article class="card metric"><label>${l}</label><strong>${fmt(v)}</strong></article>`).join('');const layers=pageData.commentLayers||[],maxLayer=Math.max(...layers.map(x=>Number(x.count)||0),1);document.querySelector('#layers').innerHTML=layers.map(x=>`<div class="layer-row"><span>${esc(x.name)}</span><span class="bar"><i style="width:${(Number(x.count)||0)/maxLayer*100}%"></i></span><b>${fmt(x.count)}</b></div>`).join('')||'<div class="empty">暂无分层</div>';const kws=(pageData.keywords||[]).slice(0,18);document.querySelector('#keywords').innerHTML=kws.map((x,i)=>`<span class="word" style="--scale:${Math.min(Number(x[1]||x.count||1),9)};--rotate:${[-2,1,0,2,-1][i%5]}deg">${esc(Array.isArray(x)?x[0]:x.text)} · ${fmt(Array.isArray(x)?x[1]:x.count)}</span>`).join('')||'<span class="empty">暂无关键词</span>';const profileRows=layers.slice().sort((a,b)=>Number(b.count)-Number(a.count)).slice(0,4),total=Math.max(profileRows.reduce((n,x)=>n+Number(x.count||0),0),1);document.querySelector('#profiles').innerHTML=profileRows.map(x=>`<div class="profile-segment" style="--grow:${Math.max(Number(x.count||0)/total*5,.65)}"><strong>${fmt(x.count)}</strong><span>${esc(x.name)}</span></div>`).join('')||'<div class="empty">暂无画像</div>';document.querySelector('#opportunities').innerHTML=opps.map(x=>`<article class="card opportunity"><div class="opp-top"><span class="type">${esc(x.type||'机会')}</span><span class="confidence">${esc(x.confidence||'待验证')}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.inference)}</p><div class="evidence">证据评论：${esc((x.evidenceCommentIds||[]).join(' / ')||'待补充')}</div><div class="suggestion"><b>验证动作</b>${esc(x.validationAction||'待设计')}</div></article>`).join('')||'<div class="card empty">暂无机会</div>';const oppById=new Map(opps.map(x=>[x.id,x]));function render(filter='all'){const rows=comments.map(x=>({...x,isHigh:['高价值提问','明确需求','负面风险'].includes(x.layer)})).filter(x=>filter==='all'||x.isHigh);document.querySelector('#comments').innerHTML=rows.map((x,i)=>`<article class="comment" data-id="${esc(x.commentId)}"><i class="dot ${x.isHigh?'high':''}"></i><div><div class="comment-text">${esc(x.text)}</div><div class="comment-sub">${esc(x.layer||'常规互动')} · ${esc(x.intent||'待判断')}</div></div><span class="comment-score">♥ ${fmt(x.diggCount)}</span></article>`).join('')||'<div class="empty">暂无评论</div>';document.querySelectorAll('.comment').forEach(el=>el.onclick=()=>openDrawer(comments.find(x=>String(x.commentId)===el.dataset.id)))}function openDrawer(x){if(!x)return;document.querySelector('#drawerTitle').textContent=x.text;document.querySelector('#drawerClass').textContent=x.layer||'待判断';document.querySelector('#drawerIntent').textContent=x.intent||'待判断';document.querySelector('#drawerNext').textContent=oppById.get(x.opportunityId)?.validationAction||'保留为证据，结合更多同类评论继续观察。';document.querySelector('#drawer').classList.add('open')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.filter)});document.querySelector('#close').onclick=()=>document.querySelector('#drawer').classList.remove('open');document.querySelector('#drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};render();
</script><style>

</style><script>
(()=>{const root=document.querySelector('#profiles');if(!root)return;const rows=(pageData.commentLayers||[]).slice().sort((a,b)=>Number(b.count||0)-Number(a.count||0)).slice(0,4),total=Math.max(rows.reduce((sum,item)=>sum+Number(item.count||0),0),1),max=Math.max(...rows.map(item=>Number(item.count||0)),1);root.classList.add('profile-ranked');root.innerHTML=rows.map(item=>{const count=Number(item.count||0),share=Math.round(count/total*100);return `<div class="profile-rank"><span class="profile-rank-label">${esc(item.name)}<small class="profile-rank-share">占比 ${share}%</small></span><span class="profile-rank-track"><i class="profile-rank-fill" style="width:${count/max*100}%"></i></span><b class="profile-rank-value">${fmt(count)}</b></div>`}).join('')||'<div class="empty">暂无画像</div>'})();

/* Extracted from the canonical internal report: donut + liked-comment ranking + audience profiles. */
.signal-grid{grid-template-columns:.9fr 1.08fr 1.12fr}.signal-panel{min-height:268px;padding:24px 25px}.signal-panel .panel-head{margin-bottom:18px}.signal-panel .panel-head h3{font-size:17px}.donut-wrap{display:flex;min-height:185px;align-items:center;gap:22px}.signal-donut{position:relative;width:122px;height:122px;flex:none}.donut-svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.donut-segment{transition:opacity .2s,filter .2s}.donut-segment:hover{filter:drop-shadow(0 0 5px var(--segment-color))}.donut-center{position:absolute;inset:29px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.07);border-radius:50%;background:#12141d;color:var(--text);font:20px var(--mono)}.signal-legend{display:grid;width:100%;gap:12px}.signal-legend-row{display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:center;color:var(--muted);font-size:11px}.signal-legend-row i{width:7px;height:7px;border-radius:50%;background:var(--tone)}.signal-legend-row b{color:var(--text);font:11px var(--mono)}.like-chart{display:grid;gap:14px;padding-top:2px}.like-row{display:grid;gap:7px}.like-label{display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:center}.like-label b{color:var(--violet);font:10px var(--mono)}.like-label span{overflow:hidden;color:#cfd2db;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.like-label strong{color:var(--orange);font:12px var(--mono)}.like-track{height:8px;margin-left:33px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.07)}.like-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--cyan))}.like-row:first-child .like-track i{background:linear-gradient(90deg,var(--orange),var(--cyan))}.profile-summary-canonical{display:grid;grid-template-columns:.92fr 1.08fr;gap:12px;min-height:174px}.primary-profile{display:flex;flex-direction:column;justify-content:center;padding:19px}.primary-heading{display:flex;align-items:baseline;gap:12px}.primary-count{color:var(--cyan);font:38px/1 var(--mono);letter-spacing:-.07em}.primary-count small{margin-left:5px;color:var(--muted);font:14px var(--sans);letter-spacing:0}.primary-heading h4{margin:0;font-size:16px}.primary-profile p{margin:7px 0 0;color:var(--muted);font-size:13px}.secondary-profiles{display:grid;align-content:center;gap:4px}.secondary-profile{display:grid;grid-template-columns:9px 1fr auto;gap:9px;align-items:center;padding:6px 12px}.secondary-dot{width:8px;height:8px;border-radius:3px;background:var(--tone)}.secondary-copy b{color:#dfe2ea;font-size:13px}.secondary-count{color:var(--tone);font:21px var(--mono)}.secondary-count small{margin-left:3px;color:var(--faint);font:11px var(--sans)}.profile-summary-note{margin:9px 0 0;color:var(--faint);font-size:9px;line-height:1.5;text-align:center}@media(max-width:560px){.donut-wrap{align-items:flex-start;flex-direction:column}.profile-summary-canonical{grid-template-columns:1fr}.primary-profile{min-height:125px}}
</style><script>
(()=>{const grid=document.querySelector('.analysis-grid');if(!grid)return;grid.classList.add('signal-grid');const layers=pageData.commentLayers||[],allComments=pageData.comments||[],total=Math.max(Number(pageData.commentCount)||layers.reduce((sum,item)=>sum+Number(item.count||0),0),1),tones=['var(--cyan)','var(--orange)','var(--violet)','var(--red)'],ordered=['高价值提问','明确需求','常规互动','负面风险'].map((name,index)=>({name,count:Number(layers.find(item=>item.name===name)?.count||0),tone:tones[index]}));let offset=0;const segments=ordered.filter(item=>item.count>0).map(item=>{const percent=item.count/total*100,node=`<circle class="donut-segment" style="--segment-color:${item.tone}" cx="50" cy="50" r="40" pathLength="100" fill="none" stroke="${item.tone}" stroke-width="20" stroke-dasharray="${percent.toFixed(3)} ${(100-percent).toFixed(3)}" stroke-dashoffset="${(-offset).toFixed(3)}"></circle>`;offset+=percent;return node}).join('');const legend=ordered.map(item=>`<div class="signal-legend-row"><i style="--tone:${item.tone}"></i><span>${esc(item.name)}</span><b>${fmt(item.count)}</b></div>`).join('');const top=allComments.filter(item=>Number(item.diggCount||0)>0).sort((a,b)=>Number(b.diggCount||0)-Number(a.diggCount||0)).slice(0,4),maxLikes=Math.max(...top.map(item=>Number(item.diggCount||0)),1),likes=top.map((item,index)=>`<div class="like-row"><div class="like-label"><b>${String(index+1).padStart(2,'0')}</b><span title="${esc(item.text)}">${esc(item.text)}</span><strong>${fmt(item.diggCount)}</strong></div><div class="like-track"><i style="width:${Math.max(Number(item.diggCount||0)/maxLikes*100,8)}%"></i></div></div>`).join('');const patterns=[{name:'工具索取型',desc:'助手、链接与领取入口',tone:'var(--cyan)',words:['运营助手','运营助理','链接','领取','工作流','求一个','求求']},{name:'技术排障型',desc:'插件、权限与控制问题',tone:'var(--violet)',words:['插件','权限','沙箱','浏览器','computer use','不可用','win','Windows','安装']},{name:'成本敏感型',desc:'Token、额度与订阅',tone:'var(--orange)',words:['token','Token','tokens','额度','订阅','plus','pro','Pro','钱','贵']},{name:'新手入门型',desc:'怎么弄、如何学习',tone:'var(--pink)',words:['怎么','如何','入门','教程','不会','能不能']}].map(profile=>({...profile,count:allComments.filter(comment=>profile.words.some(word=>String(comment.text||'').includes(word))).length})).sort((a,b)=>b.count-a.count),primary=patterns[0]||{name:'待识别',desc:'暂无足够信号',count:0},secondary=patterns.slice(1),secondaryHtml=secondary.map(item=>`<div class="secondary-profile" style="--tone:${item.tone}"><i class="secondary-dot"></i><span class="secondary-copy"><b>${esc(item.name)}</b></span><strong class="secondary-count">${fmt(item.count)}<small>条</small></strong></div>`).join('');grid.innerHTML=`<article class="card panel signal-panel"><div class="panel-head"><h3>评论类型分层</h3><span>${fmt(total)} 条评论</span></div><div class="donut-wrap"><div class="signal-donut"><svg class="donut-svg" viewBox="0 0 100 100">${segments}</svg><b class="donut-center">${fmt(total)}</b></div><div class="signal-legend">${legend}</div></div></article><article class="card panel signal-panel"><div class="panel-head"><h3>高赞评论排行</h3><span>按点赞数降序</span></div><div class="like-chart">${likes||'<div class="empty">暂无点赞数据</div>'}</div></article><article class="card panel signal-panel"><div class="panel-head"><h3>用户需求画像</h3><span>主画像 / 次级画像</span></div><div class="profile-summary-canonical"><article class="primary-profile"><div class="primary-heading"><strong class="primary-count">${fmt(primary.count)}<small>条</small></strong><h4>${esc(primary.name)}</h4></div><p>${esc(primary.desc)}</p></article><div class="secondary-profiles">${secondaryHtml}</div></div><p class="profile-summary-note">信号数可重叠，不代表人口属性。</p></article>`;const head=grid.closest('.section')?.querySelector('.section-head');if(head){head.querySelector('h2').textContent='评论区发生了什么';head.querySelector('p').textContent='从原始评论到可以行动的观众信号';head.querySelector('.section-index').textContent='01 / EVIDENCE'}})();
</script><style>
/* Evidence IDs remain in JSON for validation, but are internal implementation details. */
.opportunity .evidence{display:none}.opportunity .suggestion{margin-top:auto}
</style></body></html>
