<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>抖音评论洞察 · 报告库</title>
<style>
.summary{display:-webkit-box!important;height:40px!important;min-height:40px;overflow:hidden!important;-webkit-box-orient:vertical;-webkit-line-clamp:2;text-overflow:ellipsis}
.metric-grid{grid-template-columns:.8fr .8fr 1.4fr!important;column-gap:18px!important}.metric:nth-child(2) strong{color:var(--green)!important}.metric-time strong{color:var(--orange)!important;white-space:nowrap}
.lane-empty{display:grid!important;height:auto!important;gap:8px!important;place-items:stretch!important}.lane-row{display:grid;grid-template-columns:105px 1fr 18px;gap:8px;align-items:center;color:var(--muted);font-size:10px}.lane-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lane-track{height:6px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.07)}.lane-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--cyan))}.lane-count{color:var(--faint);font:9px var(--mono);text-align:right}
.sort-menu{position:relative;width:184px;color:var(--muted);font-size:12px}.sort-menu summary{display:flex;height:43px;align-items:center;justify-content:space-between;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.045);cursor:pointer;list-style:none}.sort-menu summary::-webkit-details-marker{display:none}.sort-menu summary:after{content:'⌄';color:var(--cyan);font-size:15px}.sort-menu[open] summary{border-color:rgba(105,227,208,.55);box-shadow:0 0 0 4px rgba(105,227,208,.07)}.sort-options{position:absolute;z-index:20;top:49px;left:0;width:100%;padding:6px;border:1px solid var(--line);border-radius:13px;background:#15171f;box-shadow:0 18px 45px rgba(0,0,0,.45)}.sort-option{display:block;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:11px;text-align:left;cursor:pointer}.sort-option:hover,.sort-option.active{background:rgba(105,227,208,.11);color:var(--cyan)}@media(max-width:680px){.sort-menu{width:100%}}
.conclusion p{font-size:14px!important;line-height:1.75!important}
:root{--bg:#07080d;--panel:rgba(20,22,30,.82);--line:rgba(255,255,255,.12);--text:#f7f7fa;--muted:#969bad;--faint:#62677b;--cyan:#69e3d0;--violet:#9886ff;--orange:#ffae68;--green:#76e39d;--red:#ff788b;--mono:ui-monospace,"SFMono-Regular",Menlo,monospace;--sans:"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:var(--sans);background:radial-gradient(850px 520px at 8% -8%,rgba(66,213,191,.12),transparent 62%),radial-gradient(850px 700px at 92% 8%,rgba(120,96,232,.20),transparent 64%),var(--bg)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.013) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(#000,transparent 80%)}button,input{font:inherit}.shell{width:min(1380px,calc(100% - 64px));margin:auto;padding:46px 0 80px}.hero{display:flex;align-items:end;justify-content:space-between;margin-bottom:38px}.eyebrow{color:var(--cyan);font:12px var(--mono);letter-spacing:.16em}.hero h1{margin:12px 0 10px;font-size:clamp(40px,5vw,68px);line-height:1;letter-spacing:-.075em}.hero p{margin:0;color:var(--muted);font-size:15px}.sync{padding-bottom:5px;color:var(--muted);font:12px var(--mono)}.sync i{display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(118,227,157,.1)}.dashboard{display:grid;grid-template-columns:1.35fr 1fr 1.48fr;gap:12px;margin-bottom:46px}.panel{min-height:144px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.018));backdrop-filter:blur(18px)}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.panel-title h2{margin:0;font-size:15px;letter-spacing:-.04em}.panel-title span{color:var(--faint);font:10px var(--mono)}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric label{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:10px;font-size:30px;line-height:1;letter-spacing:-.06em}.metric:nth-child(1) strong{color:var(--cyan)}.metric:nth-child(2) strong{color:var(--violet)}.metric:nth-child(3) strong{color:var(--orange)}.metric:nth-child(4) strong{color:var(--green)}.run-note{margin-top:14px;color:var(--faint);font:9px/1.7 var(--mono)}.lane-empty{display:grid;height:75px;place-items:center;color:var(--faint);font-size:11px}.conclusion .kicker{color:var(--cyan);font:10px var(--mono)}.conclusion h3{margin:10px 0 7px;font-size:17px}.conclusion p{margin:0;color:var(--muted);font-size:11px;line-height:1.65}.section-head{display:flex;align-items:center;gap:25px;margin-bottom:16px}.section-head h2{margin:0;font-size:26px;letter-spacing:-.055em}.search-wrap{position:relative}.search-wrap:before{content:"⌕";position:absolute;left:13px;top:7px;color:var(--faint);font-size:21px}.search{width:250px;height:43px;padding:0 15px 0 38px;border:1px solid var(--line);border-radius:13px;outline:0;background:rgba(255,255,255,.045);color:var(--text)}.search:focus{border-color:rgba(105,227,208,.55);box-shadow:0 0 0 4px rgba(105,227,208,.07)}.result{margin-left:auto;color:var(--faint);font:10px var(--mono)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{display:flex;min-height:224px;flex-direction:column;padding:19px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.018) 58%);transition:transform .2s,border-color .2s;animation:in .4s both}.card:hover{transform:translateY(-3px);border-color:rgba(105,227,208,.36)}.card-head{display:flex;align-items:center;gap:13px;min-width:0}.avatar,.avatar-fallback{width:58px;height:58px;flex:0 0 58px;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,rgba(105,227,208,.18),rgba(152,134,255,.18))}.avatar-fallback{display:grid;place-items:center;color:var(--cyan);font-weight:800}.identity{min-width:0;flex:1}.name-line{display:flex;align-items:baseline;gap:7px;min-width:0}.name{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px;letter-spacing:-.04em}.handle{flex:none;color:var(--faint);font:10px var(--mono)}.lane{display:block;width:max-content;margin-top:6px;padding:3px 7px;border:1px solid rgba(105,227,208,.3);border-radius:99px;color:var(--cyan);font:9px var(--mono)}.status{margin-left:auto;padding:6px 9px;border-radius:99px;font-size:10px;white-space:nowrap}.completed{color:var(--green);background:rgba(118,227,157,.11)}.pending{color:var(--orange);background:rgba(255,174,104,.11)}.failed{color:var(--red);background:rgba(255,120,139,.11)}.summary{margin:18px 0;color:#c8cbd7;font-size:12px;line-height:1.65}.card-foot{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-top:auto;padding-top:17px;border-top:1px solid var(--line)}.meta{color:var(--faint);font:9px/1.8 var(--mono)}.open{flex:none;padding:11px 15px;border-radius:11px;background:var(--cyan);color:#07100e;font-size:11px;font-weight:800;text-decoration:none}.open.disabled{display:none}.empty{grid-column:1/-1;padding:65px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:1050px){.dashboard{grid-template-columns:1fr 1fr}.stats{grid-column:1/-1}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.shell{width:min(100% - 28px,600px);padding-top:28px}.hero{display:block}.sync{margin-top:22px}.dashboard{grid-template-columns:1fr}.stats{grid-column:auto}.metric-grid{grid-template-columns:repeat(2,1fr)}.section-head{align-items:flex-start;flex-wrap:wrap}.result{display:none}.search-wrap,.search{width:100%}.cards{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="hero"><div><div class="eyebrow">PUBLIC COMMENT INTELLIGENCE&nbsp; / &nbsp;报告库</div><h1>公域评论洞察</h1><p>所有博主的评论分析报告，从这里开始。</p></div><div class="sync"><i></i>索引已同步</div></header><section class="dashboard"><article class="panel stats"><div class="panel-title"><h2>数据统计</h2><span>当前报告库</span></div><div class="metric-grid" id="metrics"></div><div class="run-note" id="runNote"></div></article><article class="panel"><div class="panel-title"><h2>赛道分布 Top 5</h2><span>按账号数量降序</span></div><div class="lane-empty">暂无已分类赛道数据</div></article><article class="panel conclusion"><span class="kicker">当前分析结论</span><h3>评论分析报告</h3><p id="conclusion"></p></article></section><section><div class="section-head"><h2>全部报告</h2><label class="search-wrap"><span hidden>搜索账号</span><input id="search" class="search" type="search" placeholder="搜索博主名称或抖音号"></label><span class="result" id="result"></span></div><div class="cards" id="cards"></div></section></main>
<script>document.querySelector('.hero h1').textContent='抖音评论洞察'</script><script src="comment-insight-index-data.js"></script><script>
(()=>{'use strict';const d=window.COMMENT_INSIGHT_INDEX||{updatedAt:'',reports:[]},all=Array.isArray(d.reports)?d.reports:[],$=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[<>]/g,''),fmt=v=>new Intl.NumberFormat('zh-CN').format(Number(v)||0),labels={completed:'已完成分析',pending:'数据准备中',failed:'分析失败'};function fallback(n){return `<div class="avatar-fallback">${safe(n).slice(0,1)||'评'}</div>`}function card(a,i){const ready=a.status==='completed'&&a.file,img=a.avatar?`<img class="avatar" src="${safe(a.avatar)}" alt="" loading="lazy">`:fallback(a.displayName);return `<article class="card" style="animation-delay:${Math.min(i*35,280)}ms"><div class="card-head">${img}<div class="identity"><div class="name-line"><h3 class="name">${safe(a.displayName)||'抖音名称未获取'}</h3><span class="handle">@${safe(a.accountId)}</span></div><span class="lane">${safe(a.lane)||'未分类'}</span></div><span class="status ${safe(a.status)}">${labels[a.status]||'未知'}</span></div><p class="summary">${safe(a.summary)||'评论分析报告'}</p><div class="card-foot"><div class="meta">分析次数 ${a.status==='completed'?1:0}　·　最近更新 ${safe(a.updatedAt)||'暂无'}<br>${fmt(a.commentCount)} 条评论　·　${fmt(a.followers)} 粉丝</div><a class="open${ready?'':' disabled'}" href="${ready?encodeURI(a.file):'#'}">打开报告</a></div></article>`}function render(){const q=$('search').value.trim().toLowerCase(),rows=all.filter(a=>!q||`${a.displayName||''} ${a.accountId||''}`.toLowerCase().includes(q));$('cards').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">没有匹配的报告</div>';$('result').textContent=`显示 ${rows.length} / ${all.length}`;document.querySelectorAll('.avatar').forEach(img=>img.addEventListener('error',()=>img.outerHTML=fallback(img.closest('.card').querySelector('.name').textContent),{once:true}))}const done=all.filter(a=>a.status==='completed'),comments=all.reduce((n,a)=>n+Number(a.commentCount||0),0),opps=all.reduce((n,a)=>n+Number(a.opportunityCount||0),0),metrics=[['数据统计',all.length],['执行次数',done.length],['累计评论',comments],['发现机会',opps]];$('metrics').innerHTML=metrics.map(([l,v])=>`<div class="metric"><label>${l}</label><strong>${fmt(v)}</strong></div>`).join('');$('runNote').textContent=`上次更新运行时间：${safe(d.updatedAt)||'暂无'}　　累计运行次数：暂无记录`;$('conclusion').textContent=`已完成 ${done.length} 份报告，处理 ${fmt(comments)} 条评论，发现 ${fmt(opps)} 个机会。建议进入详情页查看证据链。`;$('search').addEventListener('input',render);render()})();
</script><script>
(()=>{const d=window.COMMENT_INSIGHT_INDEX||{reports:[]},reports=d.reports||[],opportunities=reports.reduce((sum,item)=>sum+Number(item.opportunityCount||0),0),lastRun=d.updatedAt||reports.map(item=>item.updatedAt||'').sort().at(-1)||'暂无';document.getElementById('metrics').innerHTML=`<div class="metric"><label>博主数量</label><strong>${reports.length}</strong></div><div class="metric"><label>发现机会</label><strong>${opportunities}</strong></div><div class="metric metric-time"><label>最后执行时间</label><strong>${lastRun}</strong></div>`;document.getElementById('runNote').remove();const counts=reports.reduce((map,item)=>(map[item.lane||'未分类']=(map[item.lane||'未分类']||0)+1,map),{}),top=Object.entries(counts).filter(([name])=>name!=='未分类').sort((a,b)=>b[1]-a[1]).slice(0,5),max=Math.max(...top.map(([,count])=>count),1),chart=document.querySelector('.lane-empty');chart.innerHTML=top.map(([name,count])=>`<div class="lane-row"><span class="lane-name" title="${name}">${name}</span><span class="lane-track"><span class="lane-fill" style="display:block;width:${count/max*100}%"></span></span><b class="lane-count">${count}</b></div>`).join('')||'暂无已分类赛道数据'})();
</script><script>
(()=>{const reports=window.COMMENT_INSIGHT_INDEX?.reports||[],byId=new Map(reports.map((item,index)=>[String(item.accountId),{...item,index}])),head=document.querySelector('.section-head'),search=document.getElementById('search'),cards=document.getElementById('cards'),menu=document.createElement('details');let mode='default';const choices=[['default','默认排序'],['followers-desc','粉丝量：从高到低'],['followers-asc','粉丝量：从低到高'],['time-desc','执行时间：从新到旧'],['time-asc','执行时间：从旧到新']];menu.className='sort-menu';menu.innerHTML=`<summary>默认排序</summary><div class="sort-options">${choices.map(([value,label],index)=>`<button class="sort-option${index?'':' active'}" data-value="${value}" type="button">${label}</button>`).join('')}</div>`;head.insertBefore(menu,document.getElementById('result'));const time=item=>Date.parse(item.executionAt||item.updatedAt||'')||0;function sortCards(){const nodes=[...cards.querySelectorAll('.card')];nodes.sort((a,b)=>{const aid=a.querySelector('.handle')?.textContent.replace(/^@/,'')||'',bid=b.querySelector('.handle')?.textContent.replace(/^@/,'')||'',x=byId.get(aid)||{},y=byId.get(bid)||{};if(mode==='followers-desc')return Number(y.followers||0)-Number(x.followers||0);if(mode==='followers-asc')return Number(x.followers||0)-Number(y.followers||0);if(mode==='time-desc')return time(y)-time(x);if(mode==='time-asc')return time(x)-time(y);return Number(x.index||0)-Number(y.index||0)});nodes.forEach(node=>cards.appendChild(node))}menu.addEventListener('click',event=>{const button=event.target.closest('.sort-option');if(!button)return;mode=button.dataset.value;menu.querySelector('summary').textContent=button.textContent;menu.querySelectorAll('.sort-option').forEach(item=>item.classList.toggle('active',item===button));menu.open=false;sortCards()});search.addEventListener('input',sortCards);document.addEventListener('click',event=>{if(!menu.contains(event.target))menu.open=false})})();
</script></body></html>
